name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build, deploy to api.mjdm.us
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm@12.16.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Assemble production bundle
        run: |
          pnpm --filter @mjdm/cloud-api deploy --prod "$RUNNER_TEMP/bundle"
          cp -r dist "$RUNNER_TEMP/bundle/dist"
          cp -r src/database/migrations "$RUNNER_TEMP/bundle/dist/database/migrations"
          rm -rf "$RUNNER_TEMP/bundle"/{src,test,docs,ops}

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload
        run: |
          rsync -az --delete --exclude '.env' --exclude '.env.bak*' --exclude 'data' \
            "$RUNNER_TEMP/bundle/" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/mjdm/api/"

      - name: Sync admin account settings to the server
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: |
          # The upload above never touches the server's .env, so the admin account is set here.
          # Skipped when the secrets are not defined. The values never appear in the logs.
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD_HASH" ]; then
            echo "ADMIN_EMAIL / ADMIN_PASSWORD_HASH secrets not set: leaving the server .env as it is"
            exit 0
          fi
          umask 077
          {
            echo "ADMIN_EMAIL=$ADMIN_EMAIL"
            echo "ADMIN_PASSWORD_HASH='$ADMIN_PASSWORD_HASH'"
          } > "$RUNNER_TEMP/admin.env"
          scp "$RUNNER_TEMP/admin.env" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/mjdm-admin.env"
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd /var/www/mjdm/api
            touch .env && chmod 600 .env
            sed -i "/^ADMIN_EMAIL=/d;/^ADMIN_PASSWORD_HASH=/d" .env
            [ -n "$(tail -c1 .env)" ] && echo >> .env
            cat /tmp/mjdm-admin.env >> .env
            rm -f /tmp/mjdm-admin.env
            echo "admin settings written to .env"
          '

      - name: Migrate and restart
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /var/www/mjdm/api
          node --env-file=.env -e "require('./dist/database/migrate').runMigrations().then(r=>{console.log('migrations',JSON.stringify(r));process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"
          pm2 describe mjdm-api >/dev/null 2>&1 \
            && pm2 restart mjdm-api --update-env \
            || pm2 start dist/main.js --name mjdm-api --node-args="--env-file=.env"
          pm2 save
          REMOTE

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://api.mjdm.us/health/live || true)
            echo "attempt $i: HTTP $code"; [ "$code" = "200" ] && exit 0; sleep 5
          done
          exit 1
